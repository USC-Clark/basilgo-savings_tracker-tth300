<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Tracker - Goals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <h1>Savings Tracker</h1>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="savings-log.html">Savings Log</a></li>
      <li><a href="savings-form.html">Add Entry</a></li>
      <li><a href="goals.html">Goals</a></li>
    </ul>
  </nav>

  <main>
    <h2>Savings Goal</h2>

    <form id="goalForm">
      <label for="goalAmount">Target Amount</label>
      <input type="number" id="goalAmount" step="0.01" required>
      <button type="submit">Save Goal</button>
    </form>

    <section class="goal-progress">
      <p>Current total: <span id="goalCurrentTotal">0</span></p>
      <p>Target: <span id="goalTarget">0</span></p>
      <p>Progress: <span id="goalPercent">0</span>%</p>

      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
