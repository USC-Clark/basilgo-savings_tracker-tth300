<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Tracker - Add/Edit Entry</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <h1>Savings Tracker</h1>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="savings-log.html">Savings Log</a></li>
      <li><a href="savings-form.html">Add Entry</a></li>
      <li><a href="goals.html">Goals</a></li>
    </ul>
  </nav>

  <main>
    <h2 id="formTitle">Add Savings Entry</h2>

    <form id="savingsForm">
      <input type="hidden" id="entryId">

      <label for="date">Date</label>
      <input type="date" id="date" required>

      <label for="amount">Amount</label>
      <input type="number" id="amount" step="0.01" required>

      <label for="note">Note / Source</label>
      <input type="text" id="note" placeholder="ex. Allowance">

      <button type="submit">Save Entry</button>
      <a href="savings-log.html">Cancel</a>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
